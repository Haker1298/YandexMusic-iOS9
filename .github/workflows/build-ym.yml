name: Build YandexMusic

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: Cache iOS SDK
        id: cache-sdk
        uses: actions/cache@v3
        with:
          path: ${{ runner.temp }}/iphoneos-sdk
          key: iphoneos-sdk-14.5

      - name: Download iOS SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ runner.temp }}/iphoneos-sdk
          $THEOS/bin/sdk_download 2>/dev/null || true

      - name: Build .deb
        run: |
          make clean package

      - name: Upload .deb
        uses: actions/upload-artifact@v3
        with:
          name: YandexMusic-armv7-arm64
          path: packages/*.deb
          if-no-files-found: error
