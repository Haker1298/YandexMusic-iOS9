name: Build YandexMusic

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos + ldid
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "PATH=$THEOS/bin:$PATH" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          brew install ldid xz

      - name: Download iOS 16.5 SDK
        run: |
          mkdir -p $THEOS/sdks
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          cp -rn sdks-master/*.sdk $THEOS/sdks/ 2>/dev/null || true

      - name: Build .deb
        run: make clean package

      - name: Copy Info.plist & repack deb with gzip
        run: |
          set -e
          DEB=$(ls -t packages/*.deb | head -1)
          echo "Repacking $DEB for iOS 9..."
          WORK=$(mktemp -d)
          cp "$DEB" "$WORK/"
          cd "$WORK"
          ar x *.deb
          # Extract data, copy Info.plist, repack
          if [ -f data.tar.lzma ]; then
            xz -d data.tar.lzma
          elif [ -f data.tar.xz ]; then
            xz -d data.tar.xz
          elif [ -f data.tar.gz ]; then
            gunzip data.tar.gz
          fi
          # Inject Info.plist into the .app bundle inside data.tar
          tar xf data.tar
          cp $GITHUB_WORKSPACE/YandexMusic.plist Applications/YandexMusic.app/Info.plist
          echo "[OK] Info.plist injected"
          tar cf data.tar Applications
          gzip -f data.tar
          # Rebuild .deb with gzip-compressed data
          ar r $(basename "$DEB") debian-binary control.tar.gz data.tar.gz
          cp $(basename "$DEB") "$DEB"
          echo "[OK] Repacked with gzip + Info.plist"
          rm -rf "$WORK"

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: YandexMusic-armv7-arm64
          path: packages/*.deb
          if-no-files-found: error
