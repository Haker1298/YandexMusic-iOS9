<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="stylesheet" href="app.css">
<title>Моя Волна</title>
</head>
<body>
<div id="content">
    <div class="loading"><div class="spinner"></div><br>Загрузка станции...</div>
</div>

<script src="app.js"></script>
<script>
var currentStationId = null;
var currentTracks = [];
var currentTrackIndex = -1;

window.onPageReady = function(token) {
    if (window.__GUEST__) {
        showGuestSearch();
        return;
    }
    loadDashboard();
};

function showGuestSearch() {
    var el = document.getElementById('content');
    var html = '';
    html += '<div style="text-align:center;padding:24px 16px 8px;">';
    html += '<div style="color:#fff;font-size:16px;font-weight:bold;margin-bottom:4px;">Гостевой режим</div>';
    html += '<div style="color:#888;font-size:12px;">Войдите для прослушивания</div>';
    html += '</div>';
    html += '<div class="search-box"><div class="search-input-wrap">';
    html += '<input type="search" class="search-input" id="guest-search" placeholder="Поиск треков..." autocorrect="off" autocomplete="off">';
    html += '</div></div>';
    html += '<div id="guest-results"></div>';
    el.innerHTML = html;

    var input = document.getElementById('guest-search');
    var searchTimeout = null;
    input.addEventListener('input', function() {
        var q = this.value.trim();
        if (searchTimeout) clearTimeout(searchTimeout);
        if (q.length < 2) {
            document.getElementById('guest-results').innerHTML = '';
            return;
        }
        searchTimeout = setTimeout(function() { doGuestSearch(q); }, 600);
    });
    input.addEventListener('keydown', function(e) {
        if (e.keyCode === 13) {
            if (searchTimeout) clearTimeout(searchTimeout);
            doGuestSearch(this.value.trim());
        }
    });
}

function doGuestSearch(query) {
    if (!query || query.length < 2) return;
    var el = document.getElementById('guest-results');
    el.innerHTML = '<div class="loading"><div class="spinner"></div><br>Поиск...</div>';

    YM.apiCall('GET', '/search?text=' + encodeURIComponent(query) + '&type=tracks&page=0', null, function(data) {
        if (data.error) {
            el.innerHTML = '<div class="error-msg">Ошибка поиска</div>';
            return;
        }
        var result = data.result;
        if (!result) return;
        var tracks = (result.tracks || {}).results || [];
        if (tracks.length === 0) {
            el.innerHTML = '<div class="empty-state"><div class="empty-text">Ничего не найдено</div></div>';
            return;
        }
        el.innerHTML = '<div class="track-list" id="guest-tracks"></div>';
        YM.renderTrackList(tracks, 'guest-tracks');
    });
}

function loadDashboard() {
    var el = document.getElementById('content');
    YM.showLoading('content');

    YM.apiCall('GET', '/rotor/station/dashboard', null, function(data) {
        if (data.error) {
            YM.showError('content', 'Не удалось загрузить станции: ' + JSON.stringify(data.error));
            return;
        }
        renderDashboard(data.result);
    });
}

function renderDashboard(result) {
    var el = document.getElementById('content');
    var stations = result.stations || [];
    var html = '';

    var waveStation = null;
    for (var i = 0; i < stations.length; i++) {
        var s = stations[i];
        var parent = s.parent || {};
        if (parent.id === 'user:onyourwave' || s.id === 'user:onyourwave' ||
            (s.name && (s.name.indexOf('Моя волна') > -1 || s.name.indexOf('Волна') > -1))) {
            waveStation = s;
            break;
        }
    }

    if (waveStation) {
        currentStationId = waveStation.id || waveStation.stationFor || (waveStation.parent && waveStation.parent.id);
        html += '<div class="wave-card">';
        html += '<div class="station-name">' + YM.escapeHtml(waveStation.name || 'Моя Волна') + '</div>';
        var desc = waveStation.description || (waveStation.parent && waveStation.parent.description) || 'Персональная радиостанция';
        html += '<div class="station-desc">' + YM.escapeHtml(desc) + '</div>';
        html += '<button class="btn-play" onclick="startWave()">&#9654; Слушать</button>';
        html += '</div>';
    }

    var otherStations = [];
    for (var j = 0; j < stations.length; j++) {
        if (stations[j] !== waveStation && stations[j].name) {
            otherStations.push(stations[j]);
        }
    }

    if (otherStations.length > 0) {
        html += '<div class="section-header">Другие станции</div>';
        html += '<div class="suggestions">';
        for (var k = 0; k < Math.min(otherStations.length, 10); k++) {
            var st = otherStations[k];
            html += '<div class="suggestion-chip" onclick="playStation(\'' + (st.id || '') + '\', \'' + YM.escapeHtml(st.name || '') + '\')">' + YM.escapeHtml(st.name || '') + '</div>';
        }
        html += '</div>';
    }

    el.innerHTML = html;
}

function startWave() {
    var stationId = currentStationId;
    if (!stationId) stationId = 'user:onyourwave';
    playStation(stationId, 'Моя Волна');
}

function playStation(stationId, stationName) {
    var el = document.getElementById('content');
    el.innerHTML = '<div class="loading"><div class="spinner"></div><br>Загрузка треков...</div>';

    var body = {
        queue: {
            station: {
                stationFromType: 'radio_station',
                stationId: stationId,
                radioStationType: 'STATION'
            }
        }
    };

    YM.apiCall('POST', '/rotor/station/station:' + stationId + '/tracks', body, function(data) {
        if (data.error || !data.result || !data.result.sequence) {
            YM.showError('content', 'Не удалось получить треки');
            return;
        }
        var seq = data.result.sequence;
        var tracks = [];
        for (var i = 0; i < seq.length; i++) {
            var track = seq[i].track || seq[i].trackedTracks;
            if (track) {
                if (track.tracks) {
                    for (var j = 0; j < track.tracks.length; j++) {
                        tracks.push(track.tracks[j]);
                    }
                } else {
                    tracks.push(track);
                }
            }
        }
        if (tracks.length === 0) {
            YM.showError('content', 'Нет доступных треков');
            return;
        }
        currentTracks = tracks;
        currentTrackIndex = 0;
        playCurrentTrack(stationName);
    });
}

function playCurrentTrack(stationName) {
    if (currentTrackIndex < 0 || currentTrackIndex >= currentTracks.length) return;
    var track = currentTracks[currentTrackIndex];

    var artistName = '';
    if (track.artists && track.artists.length > 0) {
        artistName = track.artists[0].name || '';
    }
    var coverUrl = YM.getCoverUrl(track.coverUri, '200x200');

    var html = '';
    html += '<div class="section-header" style="text-align:center;padding-top:16px;">' + YM.escapeHtml(stationName || 'Станция') + '</div>';
    html += '<div class="now-playing" id="np">';
    html += '<img class="np-cover" src="' + coverUrl + '" onerror="this.style.display=' + "'none'" + '">';
    html += '<div class="np-title" id="np-title">' + YM.escapeHtml(track.title || '') + '</div>';
    html += '<div class="np-artist" id="np-artist">' + YM.escapeHtml(artistName) + '</div>';
    html += '<div class="np-progress"><div class="np-progress-fill" id="np-fill"></div></div>';
    html += '<div class="np-time"><span class="np-current" id="np-current">0:00</span><span class="np-duration" id="np-dur">' + YM.formatDuration(track.durationMs ? track.durationMs/1000 : 0) + '</span></div>';
    html += '</div>';

    html += '<div class="wave-controls">';
    html += '<button class="wc-btn" onclick="skipPrev()"><img src="player_prev.png" style="width:22px;height:22px;margin-top:17px;"></button>';
    html += '<button class="wc-btn" onclick="skipNext()"><img src="player_next.png" style="width:22px;height:22px;margin-top:17px;"></button>';
    html += '</div>';

    html += '<div class="section-header" style="font-size:16px;padding-top:8px;">Далее в эфире</div>';
    html += '<div class="track-list" id="queue-list"></div>';

    document.getElementById('content').innerHTML = html;

    var remaining = [];
    for (var i = currentTrackIndex + 1; i < currentTracks.length && remaining.length < 10; i++) {
        remaining.push(currentTracks[i]);
    }
    YM.renderTrackList(remaining, 'queue-list');

    window.YM_onTrackClick = function(idx) {
        currentTrackIndex = currentTrackIndex + 1 + idx;
        playCurrentTrack(stationName || 'Станция');
    };
    var ql = document.getElementById('queue-list');
    if (ql) ql._trackClickHandler = 'YM_onTrackClick';

    YM.playTrack(track, '', currentTracks);
}

function skipNext() {
    if (currentTrackIndex < currentTracks.length - 1) {
        currentTrackIndex++;
        playCurrentTrack('Моя Волна');
    } else {
        YM.playerAction('next', {});
    }
}

function skipPrev() {
    if (currentTrackIndex > 0) {
        currentTrackIndex--;
        playCurrentTrack('Моя Волна');
    } else {
        YM.playerAction('prev', {});
    }
}

window.onPlayerUpdate = function(state) {
    if (!state) return;
    var fill = document.getElementById('np-fill');
    var curEl = document.getElementById('np-current');
    var titleEl = document.getElementById('np-title');
    var artistEl = document.getElementById('np-artist');

    if (fill && state.duration > 0) {
        var pct = (state.currentTime / state.duration) * 100;
        fill.style.width = pct + '%';
    }
    if (curEl && state.currentTime >= 0) {
        curEl.textContent = YM.formatDuration(state.currentTime);
    }
    if (titleEl && state.title) titleEl.textContent = state.title;
    if (artistEl && state.artist) artistEl.textContent = state.artist;
};

YM.onTrackClick = function(idx) {
    if (window.YM_onTrackClick) {
        window.YM_onTrackClick(idx);
    }
};
</script>
</body></html>
